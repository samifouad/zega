</head>
<body>
<header id="topbar">
  <span class="brand">zega</span>
  <span class="conn"><span class="conn-dot"></span> local · wasm</span>
  <span class="spacer"></span>
  <button id="btn-run" class="primary">Run</button>
  <button id="btn-seed">seed library</button>
  <button id="btn-clear">clear</button>

<div id="panes">

    <h2>schema</h2>

  </section>
  <section class="pane">
    <h2>query</h2>
    <textarea id="query" spellcheck="false"></textarea>
  </section>
  <section class="pane pane-graph">
    <h2>graph</h2>
    <div id="graph"></div>
  </section>
  <section class="pane">
    <h2>json</h2>
    <pre id="json"></pre>
  </section>
</div>
