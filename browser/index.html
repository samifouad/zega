<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zega</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <span class="brand">zega</span>
  <span class="conn"><span class="conn-dot"></span> local · wasm</span>
  <span class="spacer"></span>
  <button id="btn-run" class="primary">Run</button>
  <button id="btn-seed">reseed</button>
  <button id="btn-clear">clear</button>
</header>
<div id="panes">
  <section class="pane">
    <h2>schema</h2>
    <textarea id="schema" spellcheck="false"></textarea>
  </section>
  <section class="pane pane-graph">
    <h2>graph</h2>
    <div id="graph"></div>
  </section>
  <section class="pane">
    <h2>query <span id="query-time" class="pane-stat"></span></h2>
    <textarea id="query" spellcheck="false"></textarea>
  </section>
  <section class="pane">
    <h2>json <span id="json-size" class="pane-stat"></span></h2>
    <pre id="json"></pre>
  </section>
  <div id="split-x" class="split split-x" title="drag to resize columns"></div>
  <div id="split-y" class="split split-y" title="drag to resize rows"></div>
</div>
<div id="tour">
  <button id="btn-play" class="primary">pause</button>
  <div id="tour-queries"></div>
</div>
<script type="module" src="repl.js"></script>
</body>
</html>
