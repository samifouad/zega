name: npm release (disabled pending registry setup)

# Never dispatch manually or publish on a branch push / GitHub release event.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  package:
    # Deliberate hard stop. Sami must resolve the first-publish bootstrap and
    # configure npm trust + the GitHub npm environment before Ava enables this.
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/npm-package
      - name: Require tag to match the workspace-derived stable version
        run: node npm/check-release.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package
          path: artifacts/zega-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'zegadb/zega' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # Separate clean job: no checkout, build, dependency scripts or npm secret.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the OIDC-capable npm CLI
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: artifact
      - name: Publish the exact tested tarball through OIDC
        shell: bash
        run: |
          set -euo pipefail
          packages=(artifact/zega-*.tgz)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          npm publish "${packages[0]}" --registry=https://registry.npmjs.org/ --access=public --provenance --ignore-scripts
