# SPIKE — storage-backed zega in a Durable Object (zegadb/aps). Not product.
[package]
name = "zega-edge-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zega-storage-spike = { path = "..", default-features = false }
worker = "=0.8.6"
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
