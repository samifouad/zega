# SPIKE — not product code. zegadb/aps (storage-backed zega), branch
# claude/storage-backed-spike. Measures the zega read/write paths over a
# storage trait backed by SQLite (the same engine as Durable Object SQLite),
# with a bounded cache, against the in-memory engine. Outside the workspace on
# purpose: it adds rusqlite, and nothing in the product depends on it.
[package]
name = "zega-storage-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
zega = { path = "../../zega", default-features = false }
rusqlite = { version = "=0.32.1", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
libc = { version = "0.2", optional = true }

[features]
default = ["native"]
native = ["dep:rusqlite", "dep:libc"]

[[bin]]
name = "bench"
required-features = ["native"]

[[example]]
name = "probe"
required-features = ["native"]

[[test]]
name = "parity"
required-features = ["native"]

[profile.release]
debug = false
