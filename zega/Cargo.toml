[package]
name = "zega"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "zega, a graph database built for speed. The engine is developed at github.com/zegadb/zega and will be published under this name."
homepage = "https://zega.dev"
readme = "README.md"
keywords = ["graph", "database", "query", "zql"]
categories = ["database-implementations"]

[features]
default = ["http"]
http = ["dep:ureq"]

[dependencies]
csv = "1.3"
url = "2.5"
regex = "1"
base64 = { workspace = true }
bincode = { workspace = true }
crc32fast = { workspace = true }
getrandom = { workspace = true }
# Software sin/cos/asin: the A* heuristic is bit-identical on native and wasm.
libm = "0.2"
hmac = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "~3.4.2", optional = true, default-features = false, features = ["rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
