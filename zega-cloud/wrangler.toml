name = "zega-cloud-spike"
main = "entry.mjs"
compatibility_date = "2026-09-24"
workers_dev = true
send_metrics = false

[build]
command = "node build.mjs"

[vars]
SPIKE_CONTROLS = "false"
SNAPSHOT_BYTES = "8388608"

[[durable_objects.bindings]]
name = "GRAPHS"
class_name = "GraphObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GraphObject"]
