[workspace]
members = ["zega-core", "zega-graph", "zega-kv", "zega-parser", "zega-wal"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
dashmap = "6.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
thiserror = "1.0"
base64 = "0.22"
hmac = "0.12"
rsa = { version = "0.9", features = ["pem"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["oid"] }

zega-graph = { path = "zega-graph" }
zega-kv = { path = "zega-kv" }
zega-parser = { path = "zega-parser" }
zega-wal = { path = "zega-wal" }
