[workspace]
resolver = "2"
members = ["zega-core","zega-graph","zega-kv","zega-parser","zega-wal","zega-bench","zega-server"]
exclude = ["zega-bridge","zega-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/samifouad/zega"

[workspace.dependencies]
dashmap = "6.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.4"
getrandom = { version = "0.2", features = ["js"] }
tokio = "1"
thiserror = "1.0"
base64 = "0.22"
hmac = "0.12"
rsa = { version = "0.9", features = ["pem"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["oid"] }
smallvec = "1.15"
wasm-bindgen = "0.2"

zega-graph = { path = "zega-graph" }
zega-kv = { path = "zega-kv" }
zega-parser = { path = "zega-parser" }
zega-wal = { path = "zega-wal" }
zega-core = { path = "zega-core" }
