[workspace]
resolver = "2"
members = ["zega","zega-bench","zega-server","zega-cli","zega-cloud"]
exclude = ["zega-wasm"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/zegadb/zega"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.4"
getrandom = { version = "0.2", features = ["js"] }
tokio = "1"
thiserror = "1.0"
base64 = "0.22"
hmac = "0.12"
rsa = { version = "0.9", features = ["pem"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["oid"] }
smallvec = "1.15"
wasm-bindgen = "0.2"

zega = { path = "zega" }
