[package]
name = "zega-bench"
version.workspace = true
edition = "2021"

[dependencies]
zega-core = { path = "../zega-core" }
zega-parser = { path = "../zega-parser" }
redis = "0.27"
neo4rs = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[[bin]]
name = "zega-bench"
path = "src/main.rs"
